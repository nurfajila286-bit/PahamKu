<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buat Kata Sandi Baru - PahamKu</title>
  
  <!-- IMPOR FONT: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* =========================================================
       1. GLOBAL STYLES & RESET
       ========================================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      color: #334155;
      overflow: hidden;
    }

    /* =========================================================
       2. TOP HEADER NAVIGATION (Tinggi: 52px)
       ========================================================= */
    .top-header {
      height: 52px;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #ffffff;
      border-bottom: 1px solid #eef2f6;
      flex-shrink: 0;
      z-index: 10;
    }

    .logo-box {
      display: inline-flex;
      align-items: center;
      gap: 5.06px;
      height: 17.09px;
      text-decoration: none;
    }

    .logo-icon {
      height: 17.09px;
      width: 17.09px;
      flex-shrink: 0;
    }

    .logo-text {
      font-size: 15px;
      font-weight: 700;
      color: #0f2942;
      letter-spacing: -0.3px;
      line-height: 1;
      display: flex;
      align-items: center;
    }

    .logo-text span {
      color: #2563eb;
    }

    .top-help-link {
      font-size: 12px;
      color: #64748b;
      text-decoration: none;
      font-weight: 500;
    }

    .top-help-link:hover {
      color: #2563eb;
    }

    /* =========================================================
       3. MAIN CONTAINER & CARD FORM (PRESISI FIGMA)
       ========================================================= */
    .main-container {
      flex: 1;
      background-color: #f4f7fc;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 78.91px 0 78.92px 0;
      overflow-y: auto;
    }

    .card {
      background: #ffffff;
      width: 253.11px;
      min-height: 238.15px;
      padding: 17.72px 16.72px 15.18px 16.72px;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-title {
      font-size: 11px;
      font-weight: 700;
      color: #0f2942;
      margin-bottom: 4px;
    }

    /* Subjudul disesuaikan persis gambar Figma */
    .card-description {
      font-size: 7.5px;
      color: #64748b;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .form-group {
      margin-bottom: 8px;
    }

    .form-label {
      display: block;
      font-size: 8px;
      font-weight: 600;
      color: #0f2942;
      margin-bottom: 4px;
    }

    .input-wrapper {
      position: relative;
    }

    .form-input {
      width: 100%;
      height: 24px;
      padding: 4px 24px 4px 8px;
      font-size: 8.5px;
      border: 1px solid #dbeafe;
      border-radius: 5px;
      outline: none;
      color: #0f2942;
      background-color: #ffffff;
    }

    .form-input:focus {
      border-color: #2563eb;
    }

    .toggle-password {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .toggle-password svg {
      width: 11px;
      height: 11px;
      stroke: #64748b;
    }

    /* Syarat Validasi Sandi (Warna Hijau & Teks Sesuai Gambar Figma) */
    .validation-list {
      list-style: none;
      margin-top: 4px;
      margin-bottom: 12px;
    }

    .validation-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 7.5px;
      font-weight: 500;
      color: #2e7d32; /* Warna hijau persis gambar */
      margin-bottom: 3px;
    }

    .validation-item svg {
      width: 9px;
      height: 9px;
      stroke: #2e7d32; /* Warna centang hijau */
      flex-shrink: 0;
    }

    .btn-submit {
      width: 100%;
      height: 24px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 5px;
      font-size: 8.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #1d4ed8;
    }

    /* =========================================================
       4. FOOTER BOTTOM BAR (PEMBATAS GARIS PUTIH)
       ========================================================= */
    .footer-bar {
      height: 42px;
      padding: 0 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #64748b;
      background-color: #ffffff;
      border-top: 1px solid #eef2f6;
      flex-shrink: 0;
      z-index: 10;
    }

    .footer-nav {
      display: flex;
      gap: 16px;
    }

    .footer-nav a {
      color: #64748b;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="top-header">
    <a href="#" class="logo-box">
      <svg class="logo-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="100" height="100" rx="28" fill="#2563EB"/>
        <path d="M67.5 17L69.3 24.2L76.5 26L69.3 27.8L67.5 35L65.7 27.8L58.5 26L65.7 24.2L67.5 17Z" fill="#FACC15"/>
        <path d="M22 62C28 57 35 57 41 62V44C35 39 28 39 22 44V62Z" fill="white" fill-opacity="0.95"/>
        <rect x="47" y="53" width="8" height="12" rx="4" fill="#93C5FD" fill-opacity="0.75"/>
        <rect x="58" y="45" width="8" height="20" rx="4" fill="#BFDBFE" fill-opacity="0.85"/>
        <rect x="69" y="38" width="8" height="27" rx="4" fill="white"/>
        <path d="M20 73C38 79 62 79 80 73" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
      </svg>
      <span class="logo-text">Paham<span>Ku</span></span>
    </a>
    <a href="#" class="top-help-link">Bantuan</a>
  </header>

  <!-- Container Utama Area Tengah -->
  <main class="main-container">
    <div class="card">
      <div>
        <h1 class="card-title">Buat kata sandi baru</h1>
        <!-- Keterangan Subjudul Presisi Gambar Figma -->
        <p class="card-description">Kode terverifikasi. Pilih kata sandi yang belum pernah kamu pakai di PahamKu.</p>
        
        <form>
          <!-- Field Kata Sandi Baru -->
          <div class="form-group">
            <label class="form-label" for="new-password">Kata sandi baru</label>
            <div class="input-wrapper">
              <input type="password" id="new-password" class="form-input" value="••••••••" required>
              <button type="button" class="toggle-password" onclick="togglePasswordVisibility('new-password')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <!-- Field Konfirmasi Kata Sandi -->
          <div class="form-group">
            <label class="form-label" for="confirm-password">Konfirmasi kata sandi</label>
            <div class="input-wrapper">
              <input type="password" id="confirm-password" class="form-input" value="••••••••" required>
              <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirm-password')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <!-- Indikator Syarat Validasi Sandi (Teks & Warna Hijau Presisi Figma) -->
          <ul class="validation-list">
            <li class="validation-item">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              Minimal 8 karakter
            </li>
            <li class="validation-item">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              Mengandung huruf dan angka
            </li>
          </ul>

          <!-- Tombol Simpan -->
          <button type="submit" class="btn-submit">Simpan kata sandi</button>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer Bar Paling Bawah dengan Pembatas Putih -->
  <footer class="footer-bar">
    <span>&copy; 2026 PahamKu</span>
    <div class="footer-nav">
      <a href="#">Panduan</a>
      <a href="#">Privasi</a>
      <a href="#">Bantuan</a>
    </div>
  </footer>

  <!-- SCRIPT TOGGLE LIKAT/SEMBUNYIKAN SANDI -->
  <script>
    function togglePasswordVisibility(inputId) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
      } else {
        input.type = 'password';
      }
    }
  </script>

</body>
</html>
