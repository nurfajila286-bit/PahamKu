<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PahamKu - Ganti kata sandi</title>
  
  <!-- Font Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- File CSS Terpisah -->
  <link rel="stylesheet" href="style-reset-password.css">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="top-header">
    <div class="logo">
      <div class="logo-box">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
          <rect width="512" height="512" rx="110" fill="#2563eb" />
          <path d="M375 125l12 28 28 12-28 12-12 28-12-28-28-12 28-12 12-28z" fill="#facc15" />
          <path d="M85 200c40-15 75-20 115 0v135c-40-20-75-15-115 0V200z" fill="#ffffff" />
          <rect x="235" y="275" width="22" height="60" rx="6" fill="#93c5fd" />
          <rect x="270" y="240" width="22" height="95" rx="6" fill="#bfdbfe" />
          <rect x="305" y="195" width="22" height="140" rx="6" fill="#ffffff" />
          <path d="M75 365c70 25 210 25 260 0" stroke="#ffffff" stroke-width="14" stroke-linecap="round" fill="none" />
        </svg>
      </div>
      <span class="logo-text">Paham<span class="highlight">Ku</span></span>
    </div>

    <div class="header-right">
      <a href="#" class="help-link">Bantuan</a>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="auth-container">
    <div class="auth-card">
      <a href="#" class="back-link">&lt; Kembali ke login</a>
      
      <h1 class="auth-title">Ganti kata sandi</h1>
      
      <p class="auth-description">
        Kode OTP untuk membuat kata sandi baru akan dikirim ke email akunmu.
      </p>

      <form class="auth-form" onsubmit="event.preventDefault();">
        <div class="form-group">
          <label for="email">Email terdaftar</label>
          <input 
            type="email" 
            id="email" 
            placeholder="nama@gmail.com" 
            required 
          />
        </div>

        <button type="submit" class="btn-primary">Kirim kode OTP</button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div>&copy; 2026 PahamKu</div>
    <div class="footer-links">
      <a href="#">Panduan</a>
      <a href="#">Privasi</a>
      <a href="#">Bantuan</a>
    </div>
  </footer>

</body>
</html>
