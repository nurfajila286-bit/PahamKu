<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profil akun - PahamKu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --blue: #1a6fdc;
  --blue-dark: #1558b0;
  --blue-soft: #dbe8fb;
  --bg: #eef3fb;
  --text: #1b2a41;
  --muted: #5b6b82;
  --border: #c9d6ea;
  --white: #ffffff;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "Inter", system-ui, sans-serif;
  color: var(--text);
  background: var(--white);
  font-size: 14px;
}

a { color: inherit; text-decoration: none; }

.page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Header */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  border-bottom: 1px solid #e3e9f3;
  background: var(--white);
}

.brand { display: flex; align-items: center; gap: 10px; }

.brand-icon { display: block; width: 26px; height: 26px; line-height: 0; }
.brand-icon svg { width: 26px; height: 26px; display: block; }

.brand-name { font-size: 18px; font-weight: 700; }
.brand-name span { color: var(--blue); }

.topbar-user { display: flex; align-items: center; gap: 8px; }

.chip {
  background: var(--blue-soft);
  color: var(--blue-dark);
  font-weight: 500;
  font-size: 13px;
  padding: 5px 14px;
  border-radius: 999px;
}

.chip-sm {
  display: inline-block;
  font-size: 11px;
  padding: 3px 12px;
  margin-top: 6px;
}

.avatar {
  background: var(--blue-soft);
  color: var(--blue-dark);
  font-weight: 600;
  border-radius: 50%;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.avatar-sm { width: 26px; height: 26px; font-size: 11px; }
.avatar-lg { width: 48px; height: 48px; font-size: 18px; }

/* Layout */
.layout {
  flex: 1;
  display: flex;
}

/* Sidebar */
.sidebar {
  width: 152px;
  flex-shrink: 0;
  padding: 16px 8px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: var(--white);
  border-right: 1px solid #e3e9f3;
}

.menu { display: flex; flex-direction: column; gap: 2px; }

.menu a {
  padding: 8px 10px;
  border-radius: 8px;
  font-weight: 500;
  color: var(--text);
}
.menu a:hover { background: var(--bg); }
.menu a.active { background: var(--blue); color: var(--white); }

.logout {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  color: var(--text);
}

/* Konten */
.content {
  flex: 1;
  background: var(--bg);
  padding: 18px 18px 40px;
}

.content h1 {
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 14px;
}

.card {
  width: 100%;
  max-width: 327px;
  background: var(--white);
  border-radius: 14px;
  padding: 16px;
  box-shadow: 0 2px 8px rgba(26, 60, 120, 0.12);
}

.user {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
}
.user-name { font-weight: 600; }

.field { margin-top: 8px; }

.field label {
  display: block;
  font-weight: 500;
  font-size: 13px;
  margin-bottom: 6px;
}

.field input {
  width: 100%;
  height: 34px;
  padding: 0 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font: inherit;
  color: var(--text);
  background: var(--white);
}

.btn-password {
  width: 100%;
  height: 36px;
  padding: 0 12px;
  border: 0;
  border-radius: 8px;
  background: var(--blue);
  color: var(--white);
  font: inherit;
  font-weight: 500;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
}
.btn-left { display: flex; align-items: center; gap: 8px; }

.hint {
  margin-top: 8px;
  font-size: 11px;
  color: var(--muted);
}

.btn-save {
  margin-top: 8px;
  padding: 9px 18px;
  border: 0;
  border-radius: 8px;
  background: var(--blue);
  color: var(--white);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}

/* Footer */
.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 18px;
  border-top: 1px solid #e3e9f3;
  font-size: 11px;
  color: var(--muted);
}
.footer nav { display: flex; gap: 14px; }

/* Responsif */
@media (max-width: 640px) {
  .layout { flex-direction: column; }
  .sidebar {
    width: 100%;
    flex-direction: row;
    align-items: center;
    border-right: 0;
    border-bottom: 1px solid #e3e9f3;
    overflow-x: auto;
  }
  .menu { flex-direction: row; }
  .menu a, .logout { white-space: nowrap; }
  .card { max-width: 100%; }
}

</style>
</head>
<body>
  <div class="page">

    <!-- Header -->
    <header class="topbar">
      <a class="brand" href="#">
        <span class="brand-icon">
          <svg width="26" height="26" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <linearGradient id="logoBg" x1="3" y1="0" x2="29" y2="32" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#2c7ef0"/>
                <stop offset="1" stop-color="#1558c4"/>
              </linearGradient>
            </defs>
            <rect width="32" height="32" rx="7.6" fill="url(#logoBg)"/>
            <!-- buku terbuka -->
            <path d="M4.6 12.4Q4.6 11.9 5.3 12Q10 11.5 14.4 12.9V22.8L12.4 22.2Q8.4 21 4.6 22.3Z" fill="#fff"/>
            <!-- batang grafik -->
            <rect x="16.6" y="18.6" width="2.4" height="4.6" rx="0.6" fill="#fff" fill-opacity="0.55"/>
            <rect x="20.9" y="14.9" width="2.6" height="8.3" rx="0.6" fill="#fff" fill-opacity="0.82"/>
            <rect x="25.2" y="11.6" width="2.5" height="11.6" rx="0.6" fill="#fff"/>
            <!-- garis dasar -->
            <path d="M3.6 25Q16 27.4 28.4 25" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
            <!-- kilau -->
            <path d="M23.5 4.4Q23.8 6.4 25.8 6.7Q23.8 7 23.5 8.9Q23.2 7 21.2 6.7Q23.2 6.4 23.5 4.4Z" fill="#f7c63d"/>
          </svg>
        </span>
        <span class="brand-name">Paham<span>Ku</span></span>
      </a>
      <div class="topbar-user">
        <span class="chip">Admin</span>
        <span class="avatar avatar-sm">AU</span>
      </div>
    </header>

    <div class="layout">

      <!-- Sidebar -->
      <aside class="sidebar">
        <nav class="menu">
          <a href="#">Dashboard</a>
          <a href="#">Kelola akun</a>
          <a href="#">Data siswa</a>
          <a href="#">Klasifikasi</a>
          <a href="#">Rekomendasi</a>
          <a href="#" class="active">Profil</a>
        </nav>
        <a href="#" class="logout">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Keluar
        </a>
      </aside>

      <!-- Konten -->
      <main class="content">
        <h1>Profil akun</h1>

        <section class="card">
          <div class="user">
            <span class="avatar avatar-lg">AU</span>
            <div>
              <div class="user-name">Admin Utama</div>
              <span class="chip chip-sm">Admin</span>
            </div>
          </div>

          <div class="field">
            <label for="nama">Nama</label>
            <input id="nama" type="text" value="Admin Utama">
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" value="admin@bimbel.id">
          </div>

          <div class="field">
            <label>Kata sandi</label>
            <button type="button" class="btn-password">
              <span class="btn-left">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                Ganti kata sandi
              </span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
            <p class="hint">Klik tombol untuk membuat kata sandi baru.</p>
          </div>

          <button type="button" class="btn-save">Simpan</button>
        </section>
      </main>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>© 2026 PahamKu</span>
      <nav>
        <a href="#">Panduan</a>
        <a href="#">Privasi</a>
        <a href="#">Bantuan</a>
      </nav>
    </footer>

  </div>
</body>
</html>
