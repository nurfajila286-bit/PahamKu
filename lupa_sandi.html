<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Kata Sandi - PahamKu</title>
  
  <!-- IMPOR FONT: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* =========================================================
       1. GLOBAL STYLES & RESET
       ========================================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      color: #334155;
      overflow: hidden;
    }

    /* =========================================================
       2. TOP HEADER NAVIGATION (Bar Navigasi Atas)
       ========================================================= */
    .top-header {
      height: 52px;
      padding: 0 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #ffffff;
      border-bottom: 1px solid #eef2f6;
      flex-shrink: 0;
    }

    .logo-box {
      display: inline-flex;
      align-items: center;
      gap: 5.06px;
      height: 17.09px;
      text-decoration: none;
    }

    .logo-icon {
      height: 17.09px;
      width: 17.09px;
      flex-shrink: 0;
    }

    .logo-text {
      font-size: 15px;
      font-weight: 700;
      color: #0f2942;
      letter-spacing: -0.3px;
      line-height: 1;
      display: flex;
      align-items: center;
    }

    .logo-text span {
      color: #2563eb;
    }

    .top-help-link {
      font-size: 12px;
      color: #64748b;
      text-decoration: none;
      font-weight: 500;
    }

    .top-help-link:hover {
      color: #2563eb;
    }

    /* =========================================================
       3. MAIN CONTAINER & FORM CARD
       ========================================================= */
    .main-container {
      flex: 1;
      background-color: #f4f7fc;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .content-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 380px;
      padding: 28px 24px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
    }

    .back-link {
      display: inline-block;
      font-size: 12px;
      color: #64748b;
      text-decoration: none;
      margin-bottom: 12px;
      font-weight: 500;
    }

    .back-link:hover {
      color: #2563eb;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: #0f2942;
      margin-bottom: 6px;
    }

    .card-description {
      font-size: 12px;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      height: 36.31px;
      padding: 8px 12px;
      font-size: 12px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      outline: none;
      color: #1e293b;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input::placeholder {
      color: #94a3b8;
    }

    .form-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .btn-submit {
      width: 100%;
      height: 36.31px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #1d4ed8;
    }

    /* =========================================================
       4. FOOTER BOTTOM BAR (DENGAN GARIS PEMBATAS PUTIH)
       - Latar putih dengan border-top tipis (#eef2f6)
       ========================================================= */
    .footer-bar {
      height: 42px;
      padding: 0 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #ffffff; /* Ubah ke putih bersih */
      border-top: 1px solid #eef2f6; /* Pembatas garis atas */
      flex-shrink: 0;
    }

    .copyright {
      font-size: 12px;
      color: #64748b;
    }

    .footer-nav {
      display: flex;
      gap: 16px;
    }

    .footer-nav a {
      font-size: 12px;
      color: #64748b;
      text-decoration: none;
    }

    .footer-nav a:hover {
      color: #2563eb;
    }
  </style>
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="top-header">
    <a href="#" class="logo-box">
      <svg class="logo-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="100" height="100" rx="28" fill="#2563EB"/>
        <path d="M67.5 17L69.3 24.2L76.5 26L69.3 27.8L67.5 35L65.7 27.8L58.5 26L65.7 24.2L67.5 17Z" fill="#FACC15"/>
        <path d="M22 62C28 57 35 57 41 62V44C35 39 28 39 22 44V62Z" fill="white" fill-opacity="0.95"/>
        <rect x="47" y="53" width="8" height="12" rx="4" fill="#93C5FD" fill-opacity="0.75"/>
        <rect x="58" y="45" width="8" height="20" rx="4" fill="#BFDBFE" fill-opacity="0.85"/>
        <rect x="69" y="38" width="8" height="27" rx="4" fill="white"/>
        <path d="M20 73C38 79 62 79 80 73" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
      </svg>
      <span class="logo-text">Paham<span>Ku</span></span>
    </a>
    <a href="#" class="top-help-link">Bantuan</a>
  </header>

  <!-- Container Utama -->
  <main class="main-container">
    <div class="content-wrapper">
      <div class="card">
        <a href="#" class="back-link">&lsaquo; Kembali ke login</a>
        <h1 class="card-title">Lupa kata sandi</h1>
        <p class="card-description">Tautan untuk membuat kata sandi baru akan dikirim ke email akunmu.</p>
        
        <form>
          <div class="form-group">
            <label class="form-label" for="email">Email terdaftar</label>
            <input type="email" id="email" class="form-input" placeholder="nama@email.com" required>
          </div>
          <button type="submit" class="btn-submit">Kirim kode OTP</button>
        </form>
      </div>
    </div>

    <!-- Footer Bar dengan Pembatas Putih -->
    <footer class="footer-bar">
      <span class="copyright">&copy; 2026 PahamKu</span>
      <nav class="footer-nav">
        <a href="#">Panduan</a>
        <a href="#">Privasi</a>
        <a href="#">Bantuan</a>
      </nav>
    </footer>
  </main>

</body>
</html>
