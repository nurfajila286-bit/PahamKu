<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tambah Akun - PahamKu</title>
  
  <!-- Import Font Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      color: #334155;
      overflow: hidden;
    }

    /* Top Bar Header */
    .top-header {
      height: 52px;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #ffffff;
      border-bottom: 1px solid #eef2f6;
      flex-shrink: 0;
    }

    /* Container Logo Presisi Figma: 69.15px × 17.09px */
    .logo-box {
      display: inline-flex;
      align-items: center;
      gap: 5.06px;
      height: 17.09px;
      text-decoration: none;
    }

    .logo-icon {
      height: 17.09px;
      width: 17.09px;
      flex-shrink: 0;
    }

    .logo-text {
      font-size: 15px;
      font-weight: 700;
      color: #0f2942;
      letter-spacing: -0.3px;
      line-height: 1;
      display: flex;
      align-items: center;
    }

    .logo-text span {
      color: #2563eb;
    }

    /* User Profile Pill Right */
    .user-profile {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .role-pill {
      background-color: #eff6ff;
      color: #2563eb;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 16px;
    }

    .avatar-pill {
      background-color: #dbeafe;
      color: #1d4ed8;
      font-size: 12px;
      font-weight: 700;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Main Container (Sidebar + Content) */
    .app-body {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar Navigation (Figma Width: 118.34px) */
    .sidebar {
      width: 118.34px;
      background-color: #ffffff;
      border-right: 1px solid #eef2f6;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 10px;
      flex-shrink: 0;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 3.16px;
      list-style: none;
    }

    .nav-item a {
      display: flex;
      align-items: center;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 500;
      color: #64748b;
      text-decoration: none;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .nav-item a:hover {
      background-color: #f8fafc;
      color: #0f2942;
    }

    .nav-item.active a {
      background-color: #2563eb;
      color: #ffffff;
      font-weight: 600;
    }

    .logout-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 500;
      color: #64748b;
      text-decoration: none;
      border-radius: 6px;
    }

    .logout-btn:hover {
      color: #ef4444;
      background-color: #fef2f2;
    }

    /* Main Content Area (Figma Width: 691.66px / Fill) */
    .main-content {
      flex: 1;
      background-color: #f4f7fc;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-y: auto;
    }

    /* Back Link & Title Area */
    .back-link {
      display: inline-block;
      font-size: 12px;
      color: #64748b;
      text-decoration: none;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .back-link:hover {
      color: #2563eb;
    }

    .page-title {
      font-size: 20px;
      font-weight: 700;
      color: #0f2942;
      margin-bottom: 24px;
    }

    /* Form Layout Grid (Figma Grouping 665.09px × 127.2px) */
    .form-container {
      max-width: 665.09px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 202.5px 202.5px;
      gap: 16px 24px;
      margin-bottom: 24px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 600;
      color: #334155;
    }

    .form-input, .form-select {
      width: 100%;
      height: 36.31px;
      padding: 8px 12px;
      font-size: 12px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      outline: none;
      color: #1e293b;
      background-color: #ffffff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input::placeholder {
      color: #94a3b8;
    }

    .form-input:focus, .form-select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    /* Button Action Group */
    .btn-group {
      display: flex;
      gap: 12px;
    }

    .btn-submit {
      background-color: #2563eb;
      color: #ffffff;
      padding: 8px 24px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #1d4ed8;
    }

    .btn-cancel {
      background-color: #ffffff;
      color: #2563eb;
      border: 1px solid #bfdbfe;
      padding: 8px 24px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-cancel:hover {
      background-color: #eff6ff;
    }

    /* Global Bottom Footer Bar */
    .footer-bar {
      padding: 16px 0 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #64748b;
    }

    .footer-nav {
      display: flex;
      gap: 16px;
    }

    .footer-nav a {
      color: #64748b;
      text-decoration: none;
    }

    .footer-nav a:hover {
      color: #2563eb;
    }
  </style>
</head>
<body>

  <!-- Header Top Bar -->
  <header class="top-header">
    <a href="#" class="logo-box">
      <!-- SVG Logo PahamKu Presisi (17.09px × 17.09px) -->
      <svg class="logo-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="100" height="100" rx="28" fill="#2563EB"/>
        <path d="M67.5 17L69.3 24.2L76.5 26L69.3 27.8L67.5 35L65.7 27.8L58.5 26L65.7 24.2L67.5 17Z" fill="#FACC15"/>
        <path d="M22 62C28 57 35 57 41 62V44C35 39 28 39 22 44V62Z" fill="white" fill-opacity="0.95"/>
        <rect x="47" y="53" width="8" height="12" rx="4" fill="#93C5FD" fill-opacity="0.75"/>
        <rect x="58" y="45" width="8" height="20" rx="4" fill="#BFDBFE" fill-opacity="0.85"/>
        <rect x="69" y="38" width="8" height="27" rx="4" fill="white"/>
        <path d="M20 73C38 79 62 79 80 73" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
      </svg>
      <span class="logo-text">Paham<span>Ku</span></span>
    </a>

    <div class="user-profile">
      <span class="role-pill">Admin</span>
      <div class="avatar-pill">AU</div>
    </div>
  </header>

  <!-- Container App Body -->
  <div class="app-body">
    <!-- Sidebar Navigation (Presisi Lebar Figma: 118.34px) -->
    <aside class="sidebar">
      <ul class="nav-list">
        <li class="nav-item"><a href="#">Dashboard</a></li>
        <li class="nav-item active"><a href="#">Kelola akun</a></li>
        <li class="nav-item"><a href="#">Data siswa</a></li>
        <li class="nav-item"><a href="#">Klasifikasi</a></li>
        <li class="nav-item"><a href="#">Rekomendasi</a></li>
        <li class="nav-item"><a href="#">Profil</a></li>
      </ul>

      <a href="#" class="logout-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        Keluar
      </a>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <div>
        <!-- Back Link & Page Title -->
        <a href="#" class="back-link">&lsaquo; Kembali ke Kelola akun</a>
        <h1 class="page-title">Tambah akun</h1>

        <!-- Form Layout Grid (Presisi Dimensi Figma) -->
        <div class="form-container">
          <form>
            <div class="form-grid">
              <!-- Kolom Kiri -->
              <div class="form-group">
                <label class="form-label" for="nama">Nama lengkap</label>
                <input type="text" id="nama" class="form-input" placeholder="Masukkan nama lengkap" required>
              </div>

              <!-- Kolom Kanan -->
              <div class="form-group">
                <label class="form-label" for="role">Role</label>
                <select id="role" class="form-select" required>
                  <option value="" disabled selected>Pilih role (Admin / Pengajar / Siswa)</option>
                  <option value="admin">Admin</option>
                  <option value="pengajar">Pengajar</option>
                  <option value="siswa">Siswa</option>
                </select>
              </div>

              <!-- Kolom Kiri -->
              <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" class="form-input" placeholder="nama@email.com" required>
              </div>

              <!-- Kolom Kanan -->
              <div class="form-group">
                <label class="form-label" for="status">Status</label>
                <select id="status" class="form-select" required>
                  <option value="aktif" selected>Aktif</option>
                  <option value="nonaktif">Nonaktif</option>
                </select>
              </div>

              <!-- Kolom Kiri -->
              <div class="form-group">
                <label class="form-label" for="password">Kata sandi sementara</label>
                <input type="password" id="password" class="form-input" placeholder="Masukkan kata sandi sementara" required>
              </div>
            </div>

            <!-- Action Buttons -->
            <div class="btn-group">
              <button type="submit" class="btn-submit">Simpan</button>
              <button type="button" class="btn-cancel">Batal</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Footer Bar Bottom -->
      <footer class="footer-bar">
        <span>&copy; 2026 PahamKu</span>
        <div class="footer-nav">
          <a href="#">Panduan</a>
          <a href="#">Privasi</a>
          <a href="#">Bantuan</a>
        </div>
      </footer>
    </main>
  </div>

</body>
</html>
